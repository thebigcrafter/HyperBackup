name: Build plugin PHAR

on:
  push:
  pull_request:

jobs:
  build:
    name: Build plugin PHAR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php:
          - "8.0"

    steps:
      - uses: actions/checkout@v2

      - name: Set up PHP 8.0 environment
        uses: shivammathur/setup-php@2.15.0
        with:
          php-version: ${{ matrix.php }}

      - name: Install build Composer dependencies
        run: composer install --ignore-platform-reqs --no-dev
        
      - name: Download pinned DevTools ConsoleScript
        run: curl -o ../ConsoleScript.php https://raw.githubusercontent.com/pmmp/DevTools/a67f9af8d6cff1615975c68a9b171a8f09aac0c4/src/ConsoleScript.php
        
      - name: Create build directory
        run: mkdir build
        
      - name: Build plugin PHAR with ConsoleScript
        run: php -dphar.readonly=0 ../ConsoleScript.php --make plugin.yml,src,resources,vendor --out build/HyperBackup.phar
        
      - uses: actions/upload-artifact@v2
        with:
          name: HyperBackup
          path: build/HyperBackup.phar
